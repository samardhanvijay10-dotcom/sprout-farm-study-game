<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1F1712">
<meta name="description" content="A realistic little farm simulator — plant, tend, and harvest through the seasons.">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Sprout Farm — Cozy Seasonal Farming</title>
<style>
  :root {
    --bg-dark: #1F1712;
    --panel-bg: #EEDFA8;
    --text-primary: #EFEAD9;
    --text-dark: #2B1E16;
    --accent-gold: #E8A33D;
    --accent-green: #3B6E3D;
    --border-subtle: rgba(239, 234, 217, 0.12);
    --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.35);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; background: var(--bg-dark); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Georgia, serif; }

  #app { display:flex; flex-direction:column; height:100vh; height:100dvh; opacity:0; animation: fadeIn 0.5s ease forwards; }
  @keyframes fadeIn { to { opacity:1; } }

  .topbar {
    display:flex; justify-content: space-between; align-items:center;
    padding: 14px 20px; background: rgba(31, 23, 18, 0.92);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border-subtle);
    flex-shrink:0; gap:12px; z-index: 10;
  }
  .brand { line-height:1.1; }
  .brand-mark { font-weight:800; font-size:22px; color: var(--text-primary); letter-spacing:0.04em; text-transform: uppercase; }
  .brand-sub { font-family:'SF Mono', Consolas, monospace; font-size:9px; letter-spacing:0.16em; text-transform:uppercase; color: var(--text-primary); opacity:0.45; margin-top:2px; }

  .stats { display:flex; align-items:center; gap:16px; flex-shrink:0; }
  .icon-btn { background:none; border:none; font-size:18px; cursor:pointer; opacity:0.8; transition: transform 0.15s ease, opacity 0.15s ease; }
  .icon-btn:hover { opacity:1; transform: scale(1.1); }

  .stat.coins { display:flex; align-items:center; gap:6px; background: rgba(255,255,255,0.05); padding: 5px 10px; border-radius: 20px; border: 1px solid var(--border-subtle); }
  .coin-icon { width:16px; height:16px; flex-shrink:0; }
  #coinsVal { font-family:'SF Mono', Consolas, monospace; font-weight:700; font-size:15px; color:#F0C674; }

  .stat.level { min-width:70px; }
  #levelVal { font-family:'SF Mono', Consolas, monospace; font-weight:700; font-size:11px; color: var(--text-primary); }
  .xp-track { width:68px; height:5px; background:rgba(239,234,217,0.15); border-radius:3px; overflow:hidden; margin-top:4px; }
  .xp-fill { height:100%; background: var(--accent-green); width:0%; transition:width 0.5s ease; }

  .farm-panel {
    flex:1; display:flex; flex-direction:column; min-height:0; position:relative;
    margin:12px; background: var(--panel-bg); border-radius:20px; padding:16px;
    box-shadow: var(--shadow-soft); overflow:hidden; transition: background-color 1.2s ease-in-out;
  }

  .farm-toolbar {
    display:flex; align-items:center; justify-space-between:space-between; gap:10px;
    margin-bottom:12px; position:relative; z-index:5; width: 100%;
  }
  .toolbar-left { display:flex; flex-direction:column; gap:2px; }
  #calendarInfo { font-weight:700; font-size:14px; color: var(--text-dark); }
  #weatherInfo { font-family:'SF Mono', Consolas, monospace; font-size:11px; color: var(--text-dark); opacity:0.75; }
  .toolbar-right { display:flex; align-items:center; gap:10px; margin-left: auto; }
  #plotCount { font-family:'SF Mono', Consolas, monospace; font-size:11px; color: var(--text-dark); opacity:0.7; }
  .mini-btn { font-family: inherit; font-weight:700; font-size:12px; color:#FFF; background: var(--accent-green); border:none; border-radius:20px; padding:7px 14px; cursor:pointer; }
  .text-btn { background:none; border:none; font-family:'SF Mono', Consolas, monospace; font-size:10px; text-transform:uppercase; color: var(--text-dark); opacity:0.5; cursor:pointer; text-decoration:underline; }

  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; overflow-y:auto; align-content:start; position:relative; z-index:2; flex:1; }
  .plot { position:relative; aspect-ratio:1/1; border-radius:12px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; background: #5E432E; color: #FFF; box-shadow: inset 0 2px 5px rgba(0,0,0,0.4); border: 2px solid #3D291B; }
  .plot-emoji { font-size:28px; }
  .plot-status { font-size:10px; font-family:'SF Mono', Consolas, monospace; margin-top:4px; background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 10px; }

  .shop-dock { flex-shrink:0; background: var(--bg-dark); padding:10px 16px 16px; border-top: 1px solid var(--border-subtle); }
  .selected-banner { display:flex; align-items:center; justify-content:center; gap:10px; font-family:'SF Mono', Consolas, monospace; font-size:11px; color: var(--text-primary); margin-bottom:10px; }
  .shop-tray { display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; }
  .seed-card { flex-shrink:0; width:80px; background: var(--panel-bg); border-radius:14px; padding:10px 6px; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; border: 2px solid transparent; }
  .seed-card.selected { border-color: var(--accent-green); background: #FFF; }
  .seed-emoji { font-size:20px; }
  .seed-name { font-weight:700; font-size:11px; color: var(--text-dark); }
  .seed-cost { font-family:'SF Mono', Consolas, monospace; font-weight:700; font-size:10px; color: #8B5A2B; }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">SPROUT</div>
      <div class="brand-sub">seasons &amp; harvest</div>
    </div>
    <div class="stats">
      <div class="stat coins">
        <svg class="coin-icon" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.5" fill="#E8A33D"/></svg>
        <span id="coinsVal">50</span>
      </div>
      <div class="stat level">
        <span id="levelVal">Lv.1</span>
        <div class="xp-track"><div class="xp-fill" id="xpFill"></div></div>
      </div>
    </div>
  </header>
  <main class="farm-panel" id="farmPanel">
    <div class="farm-toolbar">
      <div class="toolbar-left">
        <span id="calendarInfo">Day 1 · Spring</span>
        <span id="weatherInfo">☀️ Sunny</span>
      </div>
      <div class="toolbar-right">
        <span id="plotCount">6 / 6 plots</span>
        <button id="resetBtn" class="text-btn">Reset</button>
      </div>
    </div>
    <div id="grid" class="grid"></div>
  </main>
  <footer class="shop-dock">
    <div class="selected-banner">
      <span id="bannerText">Select a seed below, then tap a plot to plant!</span>
    </div>
    <div id="shopTray" class="shop-tray"></div>
  </footer>
</div>

<script>
  const SEEDS = [
    { id: 'carrot', name: 'Carrot', emoji: '🥕', cost: 10, growTime: 3, sell: 20 },
    { id: 'corn', name: 'Corn', emoji: '🌽', cost: 25, growTime: 6, sell: 50 },
    { id: 'tomato', name: 'Tomato', emoji: '🍅', cost: 40, growTime: 10, sell: 90 }
  ];

  let state = {
    coins: 50,
    selectedSeed: null,
    plots: Array(6).fill(null).map(() => ({ plant: null, progress: 0, ready: false }))
  };

  function render() {
    document.getElementById('coinsVal').innerText = state.coins;
    
    // Render Shop Tray
    const shopTray = document.getElementById('shopTray');
    shopTray.innerHTML = '';
    SEEDS.forEach(seed => {
      const card = document.createElement('div');
      card.className = `seed-card ${state.selectedSeed?.id === seed.id ? 'selected' : ''}`;
      card.innerHTML = `
        <div class="seed-emoji">${seed.emoji}</div>
        <div class="seed-name">${seed.name}</div>
        <div class="seed-cost">🪙 ${seed.cost}</div>
      `;
      card.onclick = () => {
        state.selectedSeed = seed;
        document.getElementById('bannerText').innerText = `Selected ${seed.name}. Tap a empty plot to plant!`;
        render();
      };
      shopTray.appendChild(card);
    });

    // Render Plots
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    state.plots.forEach((plot, index) => {
      const p = document.createElement('div');
      p.className = 'plot';
      if (!plot.plant) {
        p.innerHTML = `<span style="opacity:0.4;">🤎</span><span class="plot-status">Empty</span>`;
      } else if (plot.ready) {
        p.innerHTML = `<span class="plot-emoji">${plot.plant.emoji}</span><span class="plot-status" style="background:#3B6E3D;">Harvest!</span>`;
      } else {
        p.innerHTML = `<span class="plot-emoji">🌱</span><span class="plot-status">${plot.progress}s</span>`;
      }

      p.onclick = () => handlePlotClick(index);
      grid.appendChild(p);
    });
  }

  function handlePlotClick(index) {
    const plot = state.plots[index];
    if (plot.ready) {
      // Harvest
      state.coins += plot.plant.sell;
      state.plots[index] = { plant: null, progress: 0, ready: false };
      render();
    } else if (!plot.plant && state.selectedSeed) {
      if (state.coins < state.selectedSeed.cost) {
        alert("Not enough coins!");
        return;
      }
      state.coins -= state.selectedSeed.cost;
      plot.plant = state.selectedSeed;
      plot.progress = state.selectedSeed.growTime;
      plot.ready = false;

      const timer = setInterval(() => {
        plot.progress--;
        if (plot.progress <= 0) {
          plot.ready = true;
          clearInterval(timer);
        }
        render();
      }, 1000);

      render();
    }
  }

  document.getElementById('resetBtn').onclick = () => {
    state.coins = 50;
    state.selectedSeed = null;
    state.plots = Array(6).fill(null).map(() => ({ plant: null, progress: 0, ready: false }));
    render();
  };

  render();
</script>
</body>
</html>
